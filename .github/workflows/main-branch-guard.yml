# Guard: main must never contain FORGE governance files.
# Governance (docs/forge/) lives on dev; promotion to main goes through
# scripts/forge-promote.sh, which squash-merges and strips docs/forge.
name: Main Branch Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-governance-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if docs/forge exists on main
        run: |
          if [ -d docs/forge ]; then
            echo "::error::docs/forge/ must not land on main. Promote via scripts/forge-promote.sh."
            git ls-files docs/forge | head
            exit 1
          fi
          echo "OK: no governance files present."
