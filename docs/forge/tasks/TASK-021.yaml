phase: design
owner_lane: single
owner: taffy
description: "Design (v3) for documentation as a release-gated, standards-compliant, portable artifact: one target-neutral canonical handbook exported to GitLab wiki (primary) and Obsidian via a deterministic, classification-gated exporter; frontmatter with reviewed_at staleness; configurable release_management/version_source/changelog (no universal VERSION); release manifest with acyclic commit ordering; forge-ship Prepare/Publish split and topology matrix. Publication is a fail-closed security boundary."
file_scope:
  - docs/forge/designs/TASK-021-docs-release-and-publishing.md
  - docs/forge/TASKS.index.yaml
acceptance_criteria:
  - "Canonical form is target-neutral (semantic paths, README nav manifest, standard links); flat is the migration default."
  - "Frontmatter enums defined; staleness keys off reviewed_at, not updated."
  - "Publishing config is flat; sensitivity gates export fail-closed with a defined lattice and fail|omit policy."
  - "Release manifest ordering is acyclic; version_source/changelog are configurable; multi-package deferred."
  - "Design carries a security-review section; TASK-023 flagged for implementation security review."
