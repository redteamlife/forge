description: "Design (v3) for reducing token burn in long batch/auto runs. Confirmed contributing control gap (execute-task carries no output contract; token-efficiency.md unreferenced from the loop; coverage varies by harness). One canonical positive-template checkpoint-output protocol loaded once at run boundaries with an inline fallback; a dedicated progress_policy field (not execution_mode) with response_style migration; task-source-neutral terminal summary; model tiering as documentation only (no config field). File-size gate removed to its own security-reviewed design. Implementation: TASK-030 (protocol + progress_policy) and TASK-031 (model guidance doc)."
