  - "Output contract is a portable positive template with a dedicated progress_policy field, response_style migration, single-checkpoint and resume behavior, and a task-source-neutral terminal summary."
  - "Model tiering is documentation-only (no unimplemented config field); file-size gate is deferred to its own design."
evidence:
