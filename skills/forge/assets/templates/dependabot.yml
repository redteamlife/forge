# FORGE template — copy to .github/dependabot.yml (security_profile: ci-security+).
# Version updates keep dependencies current; security updates are enabled
# separately under Settings -> Code security. Group minor/patch updates to
# keep PR noise low; review majors individually.
version: 2
updates:
  # Keep the repo's own Actions pinned and current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Set to the project's ecosystem: pip, npm, gomod, cargo, bundler, maven, ...
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: [dependencies]
    # reviewers: ["{{OWNER}}"]
    # ignore:
    #   - dependency-name: "legacy-pinned-lib"
    #     update-types: ["version-update:semver-major"]
