openapi: 3.0.3
info:
  title: "{{PROJECT_NAME}} API"
  version: 0.1.0
  description: |
    Contract source of truth for the {{PROJECT_NAME}} API. Generated clients
    must regenerate from this file when it changes; CI runs a drift check.

servers:
  - url: http://localhost:8080
    description: Local dev

paths:
  /v1/health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
