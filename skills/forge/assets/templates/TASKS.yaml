tasks:
  - id: TASK-001
    title: "Replace with first bounded project task"
    description: Replace this with the first bounded project task.
    status: incomplete
    # Phase groups related work for sequencing. Examples:
    #   foundation, contracts, core-api, frontend, integration, hardening
    phase: foundation
    # Owner lane is the workstream this task belongs to. In solo projects
    # leave as `single`. In multi-actor projects use lanes such as
    # `backend`, `frontend`, `infra`, `security`, `docs`, etc.
    owner_lane: single
    # Acceptance criteria should be specific, observable, and testable.
    # Two or three concrete lines is usually right.
    acceptance_criteria:
      - "Replace with a specific, observable outcome."
      - "Replace with a second observable outcome."
    # Optional pointers to the tests that will verify the task.
    # Mirror the task id in the test filename for traceability.
    tests:
      - "tests/test_TASK-001.py"
    file_scope:
      - docs/forge/TASKS.yaml
    # Optional traceability when task_source is github, gitlab, or external.
    # issue_provider: gitlab
    # issue_iid: 1
    # issue_url: https://example.com/org/repo/-/issues/1
    # plan_ref: PLAN.md#T-001
    # mr_url:
    # pr_url:
    # valid statuses: todo|incomplete|claimed|in_progress|implemented|integrated|blocked|complete (terminal: complete)
    # implemented = committed on the task branch and ready for integration review
    # integrated = accepted on the integration branch; active claim released
    # complete = accepted on the release branch or otherwise formally accepted
    # task_type: feature
    # task_type values that change downstream behavior:
    #   architecture-decision -> when application_docs: true, a new
    #     docs/adr/NNNN-<slug>.md is expected for this task
    # contract_files:
    #   - openapi.yaml
    # requires_independent_review: false
    # requires_independent_review: true blocks the implementing agent from
    # running forge-evaluation or marking the task complete; a human reviewer
    # or a separate agent session must perform evaluation.
    # depends_on:
    #   - another-task
    # assignee:
    # canonical team-mode claim fields:
    # claimed_by:
    # claimed_by_email:
    # agent:
    # claimed_at:
    # claim_commit:
    # branch:
    # when the active claim is released after integration or formal handoff:
    # claim_released_by:
    # claim_released_at:
    # pr:
    # release_pr:
    # release_commit:
